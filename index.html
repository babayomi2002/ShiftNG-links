<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your ShiftNG password</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 48px 20px; margin: 0; background: #fff; color: #1d2b22; }
    h1 { color: #0E5C35; font-size: 22px; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.5; max-width: 420px; margin: 0 auto 20px; }
    a.button { display: block; max-width: 320px; margin: 0 auto 14px; padding: 16px; border-radius: 10px;
               font-size: 17px; font-weight: bold; text-decoration: none; }
    a.app { background: #0E5C35; color: #fff; }
    .small { font-size: 13px; color: #555; }
    .team { margin-top: 40px; font-size: 12px; }
    .team a { color: #555; padding: 12px 8px; display: inline-block; }
  </style>
</head>
<body>
  <h1>Reset your ShiftNG password</h1>
  <p>Open this page on the phone where ShiftNG is installed, then tap the button below.</p>

  <a id="open-app" class="button app" href="#">Open in the ShiftNG app</a>
  <p class="small">The link works once and expires after an hour. If it has expired, ask for a new
    one from "Forgot password" in the app.</p>

  <p class="team"><a id="open-test" href="#">For the ShiftNG team: open in Expo Go</a></p>

  <script>
    // The installed app (test and store builds) opens shiftng:// links.
    var APP_LINK = 'shiftng://reset-password';
    // Expo Go (development only): the computer running "npx expo start".
    // Update this if that computer's Wi-Fi address changes (shown as "Metro: exp://..."
    // when the server starts).
    var EXPO_GO_LINK = 'exp://10.0.4.36:8081/--/reset-password';

    var params = window.location.search; // "?token_hash=...&type=recovery"
    document.getElementById('open-app').href = APP_LINK + params;
    document.getElementById('open-test').href = EXPO_GO_LINK + params;
  </script>
</body>
</html>
